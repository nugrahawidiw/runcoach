[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runcoach"
version = "0.1.0"
description = "Run-coaching analysis (pace, GAP, decoupling, cadence, CTL) fed by the Strava API"
requires-python = ">=3.11"
dependencies = ["requests>=2.31", "fitdecode>=0.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.14", "pre-commit>=4"]

[project.scripts]
runcoach = "runcoach.cli:main"

[tool.setuptools.packages.find]
include = ["runcoach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow to start. Ratchet up (add "B", "SIM", "RET") once this is clean.
select = ["E", "F", "I", "UP"]
# E702: compact `a = x; b = y` is this project's house style in metrics/ and strava/auth.py.
# E741: single-letter loop variables over laps are fine and readable here.
ignore = ["E702", "E741"]
