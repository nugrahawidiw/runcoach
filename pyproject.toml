[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "runcoach"
version = "0.1.0"
description = "Run-coaching analysis (pace, GAP, decoupling, cadence, CTL) fed by the Strava API"
readme = "README.md"
# No licence declared, by the owner's decision (2026-11-17): private personal project, stays unlicensed.
# The "Private :: Do Not Upload" classifier below makes an accidental PyPI upload fail.
requires-python = ">=3.11"
keywords = ["running", "strava", "garmin", "fit", "training-load"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Private :: Do Not Upload",
]
dependencies = ["requests>=2.31", "fitdecode>=0.10"]

[project.optional-dependencies]
# Everything needed to run the suite and the linter. Pure-python wheels only, so this installs on a
# brand-new Python before the C-extension projects have published wheels for it.
test = ["pytest>=8", "ruff>=0.14", "icalendar>=6"]
# test plus the commit hooks. pre-commit pulls in PyYAML, which needs a C compiler on a Python version
# it has no wheel for yet: on Python 3.15/Windows this failed with "Microsoft Visual C++ 14.0 or greater
# is required". Use [test] there, or install pre-commit separately once a wheel exists.
dev = ["runcoach[test]", "pre-commit>=4"]
# Only needed for `plan --ics`. The core install stays requests + fitdecode.
ics = ["icalendar>=6"]

[project.urls]
Repository = "https://github.com/nugrahawidiw/runcoach"

[project.scripts]
runcoach = "runcoach.cli:main"

[tool.setuptools.packages.find]
include = ["runcoach*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 135
target-version = "py311"

[tool.ruff.lint]
# Deliberately narrow to start. Ratchet up (add "B", "SIM", "RET") once this is clean.
select = ["E", "F", "I", "UP"]
# E702: compact `a = x; b = y` is this project's house style in metrics/ and strava/auth.py.
# E741: single-letter loop variables over laps are fine and readable here.
ignore = ["E702", "E741"]
