name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Windows is included because that is where this project is developed and run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.13']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        # [test], not [dev]: CI does not run the commit hooks, and pre-commit would pull in PyYAML.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The suite is offline by design: no network, no tokens, no secrets.
        run: python -m pytest -q
